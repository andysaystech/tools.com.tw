<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>計數</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef8ef;--surface:#fff;--surface2:#eef8ef;
  --t1:#1C1C1E;--t2:#8E8E93;--t3:#C7C7CC;
  --sep:rgba(60,60,67,0.12);
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;
  --orange:#FF9500;--purple:#AF52DE;--pink:#FF375F;
  --shadow:0 2px 20px rgba(0,0,0,0.08);
  --tab-h:58px;
}
/* dark mode */
[data-theme="dark"]{
  --bg:#0c0c14;--surface:#141420;--surface2:#1a1a2c;
  --t1:#ffffff;--t2:rgba(200,200,255,0.55);--t3:rgba(200,200,255,0.2);
  --sep:rgba(100,100,255,0.15);
  --blue:#3d8eff;--green:#30D158;--red:#FF453A;
  --orange:#FF9F0A;--purple:#BF5AF2;--pink:#FF375F;
  --shadow:0 2px 20px rgba(0,0,0,0.6);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Noto Sans TC',sans-serif;
  background:var(--bg);color:var(--t1);
  -webkit-font-smoothing:antialiased;
}
[data-theme="neon"] body{background:#080818}

/* ── TAB BAR ── */
.tab-bar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;height:var(--tab-h);align-items:center;
  background:rgba(255,255,255,0.98);
  backdrop-filter:saturate(180%) blur(40px);
  -webkit-backdrop-filter:saturate(180%) blur(40px);
  border-bottom:.5px solid var(--sep);
}
[data-theme="dark"] .tab-bar{background:rgba(44,44,46,0.96);border-bottom-color:rgba(255,255,255,0.10)}
[data-theme="dark"] .tab-item.active{color:#3d8eff}
/* ── NAV THEME DOTS ── */
.nav-theme{display:flex;align-items:center;gap:8px;padding:0 14px 0 4px;flex-shrink:0}
.nav-t-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;transition:transform .2s,box-shadow .2s;flex-shrink:0;
  box-shadow:0 0 0 1.5px rgba(128,128,128,0.28)}
.nav-t-dot:hover{transform:scale(1.15)}
.nav-t-dot.active{transform:scale(1.20);box-shadow:0 0 0 2.5px rgba(60,60,60,0.8),0 0 0 1px rgba(128,128,128,0.3)}
[data-theme="dark"] .nav-t-dot.active{box-shadow:0 0 0 2.5px rgba(255,255,255,0.9),0 0 0 1px rgba(128,128,128,0.3)}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;text-decoration:none;
  color:var(--t2);font-size:.55rem;font-weight:500;
  transition:color .15s;padding:4px 2px;-webkit-tap-highlight-color:transparent;
}
.tab-item .ti{font-size:1.35rem;line-height:1.1}
.tab-item.active{color:var(--blue)}
.tab-item:active{opacity:.6}

/* ── CONTENT AREA ── */
.content{
  position:fixed;top:var(--tab-h);left:0;right:0;bottom:0;
  display:flex;flex-direction:column;overflow:hidden;
}

/* ── TOP CONTROLS ── */
.top-ctrl{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:10px 16px 8px;flex-shrink:0;
}
.top-ctrl .seg-ctrl{grid-column:2}
.top-ctrl .ctrl-right{grid-column:3;justify-self:end}
.seg-ctrl{
  display:flex;background:transparent;
  border-radius:0;padding:0;gap:8px;
}
.seg-btn{
  padding:9px 22px;border-radius:40px;
  border:1px solid var(--sep);background:var(--surface);
  font-family:'Noto Sans TC',sans-serif;
  font-size:0.92rem;font-weight:500;line-height:1.35;
  cursor:pointer;color:var(--t2);transition:all .3s;
  display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;-webkit-tap-highlight-color:transparent;
}
.seg-btn.active{
  background:linear-gradient(135deg,var(--blue),#005cd9);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 16px rgba(0,122,255,.3);
}
[data-theme="dark"] .seg-btn.active{
  background:linear-gradient(135deg,#3d8eff,#0a55d4);
  box-shadow:0 4px 16px rgba(61,142,255,.35);
}
.ctrl-right{display:flex;gap:8px;align-items:center}
.theme-dot{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:all .25s;
}
.theme-dot:hover,.theme-dot.active{border-color:var(--t1);transform:scale(1.15)}
.td-light{background:linear-gradient(135deg,#ffe082,#fff9c4,#ffffff)}
.td-dark{background:linear-gradient(135deg,#1b2a4a,#080818)}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;
  background:var(--surface);box-shadow:var(--shadow);
  font-size:1rem;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s;
}
.icon-btn:hover{transform:scale(1.08)}

/* ── SCORE VIEW ── */
#scoreView{flex:1;overflow:hidden;display:flex;flex-direction:row}
.score-main-area{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}

/* Rank Sidebar */
.rank-sidebar{
  width:clamp(88px,18vw,130px);flex-shrink:0;display:flex;flex-direction:column;
  border-left:.5px solid var(--sep);padding:10px 8px;gap:6px;overflow-y:auto;
}
.rank-sidebar-title{
  font-size:clamp(.56rem,1.4vw,.68rem);font-weight:700;color:var(--t2);letter-spacing:.05em;
  text-transform:uppercase;padding-bottom:4px;border-bottom:.5px solid var(--sep);
  flex-shrink:0;
}
.rank-item{
  display:flex;align-items:center;gap:clamp(3px,1vw,7px);padding:5px 6px;
  border-radius:10px;background:var(--surface);box-shadow:var(--shadow);
}
.rank-pos{font-size:clamp(.7rem,1.8vw,.9rem);min-width:16px;text-align:center;flex-shrink:0}
.rank-name{
  flex:1;font-weight:600;font-size:clamp(.58rem,1.4vw,.74rem);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.rank-pts{font-weight:800;font-size:clamp(.62rem,1.5vw,.8rem);flex-shrink:0}

/* VS layout (2 teams) */
.vs-wrap{flex:1;display:flex;overflow:hidden;position:relative}
.score-side{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:12px 8px 20px;gap:6px;position:relative;overflow:hidden;
}
.score-side+.score-side{border-left:.5px solid var(--sep)}
.team-row{display:flex;align-items:center;gap:6px}
.t-color-bar{
  width:5px;border-radius:3px;align-self:stretch;min-height:20px;flex-shrink:0;
}
.team-name-inp{
  font-size:clamp(.82rem,2.2vw,1.3rem);font-weight:700;
  background:transparent;border:none;outline:none;
  color:var(--t1);font-family:inherit;
  text-align:center;max-width:clamp(100px,25vw,160px);
  padding:3px 8px;border-radius:8px;transition:background .2s;
}
.team-name-inp:focus{background:var(--sep)}
.rank-ico{font-size:clamp(.9rem,2.5vw,1.3rem);min-height:22px;display:flex;align-items:center}
.big-score{
  font-size:clamp(44px,12vw,200px);
  font-weight:900;line-height:.9;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
  transition:color .3s;
}
.big-score.pop{animation:sPop .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes sPop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}

.sc-btns{display:flex;gap:clamp(8px,3vw,16px);margin-top:clamp(8px,2.5vw,16px)}
.sc-btn{
  width:clamp(48px,10vw,74px);height:clamp(48px,10vw,74px);
  border-radius:50%;border:none;
  font-size:clamp(1.3rem,3.2vw,2rem);font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;color:#fff;
}
.sc-btn:active{transform:scale(.9)}
.sc-btn.m{background:var(--red);box-shadow:0 4px 16px rgba(255,59,48,.3)}
.sc-btn.p{background:var(--green);box-shadow:0 4px 16px rgba(52,199,89,.3)}
.sc-btn:hover{transform:scale(1.07)}
.vs-badge{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:38px;height:38px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:900;color:var(--t2);z-index:2;
}
.side-del{
  position:absolute;top:8px;right:8px;
  width:24px;height:24px;border-radius:50%;border:none;
  background:rgba(128,128,128,0.18);color:rgba(180,180,180,0.9);
  cursor:pointer;font-size:.8rem;transition:all .2s;
}
.side-del:hover{background:var(--red);color:#fff}
.score-footer{
  display:flex;justify-content:center;gap:10px;
  padding:6px 0 8px;border-top:.5px solid var(--sep);
  flex-shrink:0;flex-grow:0;
}
.footer-btn{
  padding:clamp(5px,1.5vw,8px) clamp(10px,3vw,18px);border-radius:30px;border:none;
  background:var(--surface);color:var(--t2);
  font-family:inherit;font-size:clamp(.68rem,1.8vw,.8rem);cursor:pointer;
  box-shadow:var(--shadow);transition:all .2s;
}
.footer-btn:hover{color:var(--t1)}
.footer-btn.danger:hover{color:var(--red)}

/* Grid layout (3+ teams) — 永遠全顯示，不滾動 */
.grid-wrap{
  flex:1;min-height:0;display:grid;
  overflow:hidden;
  background:var(--sep);gap:.5px;
  grid-auto-rows:1fr; /* fallback；JS 會注入明確 grid-template-rows */
  align-content:stretch;
}
.grid-card{
  background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:clamp(2px,calc(1.2vh/var(--rows,2)),7px);
  padding:clamp(4px,calc(2.2vh/var(--rows,2)),14px) clamp(6px,2vw,14px);
  overflow:visible;position:relative;
}
.grid-del{
  position:absolute;top:5px;right:5px;
  width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(128,128,128,0.18);color:rgba(180,180,180,0.9);
  cursor:pointer;font-size:.7rem;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;z-index:2;
}
.grid-del:hover{background:var(--red);color:#fff;transform:scale(1.15)}
.grid-name-inp{
  font-size:clamp(.5rem,min(1.8vw,calc(1.8vh/var(--rows,2))),.85rem)!important;
  flex-shrink:0;
}
.grid-score{
  /* 依列數縮放：rows=2→14vh；rows=3→9.3vh；rows=4→7vh */
  font-size:clamp(14px,min(6.5vw,calc(28vh/var(--rows,2))),96px);
  font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;flex-shrink:0;
  cursor:ns-resize;user-select:none;touch-action:none;
}
.grid-score.pop{animation:sPop .25s cubic-bezier(.34,1.56,.64,1)}
.grid-btns{display:flex;gap:clamp(4px,1.5vw,12px);flex-shrink:0}
.g-btn{
  width:clamp(22px,min(5.5vw,calc(11vh/var(--rows,2))),46px);
  height:clamp(22px,min(5.5vw,calc(11vh/var(--rows,2))),46px);
  border-radius:50%;border:none;
  font-size:clamp(.72rem,min(2vw,calc(3.2vh/var(--rows,2))),1.2rem);
  font-weight:700;cursor:pointer;color:#fff;transition:all .2s;
}
.g-btn:active{transform:scale(.88)}

/* ── COUNTER VIEW ── */
#counterView{flex:1;display:none;flex-direction:column;overflow:hidden}
.counter-wrap{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;padding:12px 20px 16px;
}
.counter-title-inp{
  font-size:clamp(1rem,3vw,1.5rem);font-weight:700;
  background:transparent;border:none;outline:none;
  color:var(--t2);font-family:inherit;text-align:center;
  padding:4px 10px;border-radius:8px;transition:background .2s;max-width:260px;
}
.counter-title-inp:focus{background:var(--sep);color:var(--t1)}
.counter-num{
  font-size:clamp(96px,32vw,300px);
  font-weight:900;line-height:.9;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
  color:var(--blue);transition:color .4s;
  cursor:ns-resize;user-select:none;touch-action:none;
}
.counter-num.pop{animation:sPop .22s cubic-bezier(.34,1.56,.64,1)}
.c-step-row{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:.82rem;margin-top:6px}
.c-step-inp{
  width:54px;padding:4px 8px;border-radius:9px;
  border:1px solid var(--sep);background:var(--surface);
  color:var(--t1);font-family:inherit;font-size:.9rem;text-align:center;outline:none;
  cursor:ns-resize;touch-action:none;user-select:none;
}
.c-btns{display:flex;gap:20px;margin-top:20px}
.c-btn{
  width:clamp(72px,18vw,96px);height:clamp(72px,18vw,96px);
  border-radius:50%;border:none;
  font-size:clamp(1.8rem,5vw,2.6rem);font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.c-btn:active{transform:scale(.9)}
.c-btn.cm{background:var(--surface);color:var(--red);box-shadow:0 4px 20px rgba(0,0,0,.1)}
.c-btn.cp{background:var(--blue);color:#fff;box-shadow:0 6px 24px rgba(0,122,255,.35)}
.c-btn:hover{transform:scale(1.07)}
.c-reset-btn{
  padding:8px 28px;border-radius:30px;border:none;
  background:var(--surface);color:var(--t2);
  font-family:inherit;font-size:.85rem;cursor:pointer;
  box-shadow:var(--shadow);margin-top:12px;transition:all .2s;
}
.c-reset-btn:hover{color:var(--red)}

/* FAB */
.fab{
  position:fixed;bottom:24px;right:20px;z-index:100;
  width:52px;height:52px;border-radius:50%;border:none;
  background:var(--blue);color:#fff;font-size:1.7rem;
  cursor:pointer;box-shadow:0 4px 20px rgba(0,122,255,.4);
  display:flex;align-items:center;justify-content:center;transition:all .25s;
}
.fab:hover{transform:scale(1.1)}
.fab:active{transform:scale(.93)}

/* HISTORY DRAWER */
.hist-overlay{
  position:fixed;inset:0;z-index:149;background:rgba(0,0,0,0.25);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.hist-overlay.show{opacity:1;pointer-events:auto}
.hist-drawer{
  position:fixed;top:var(--tab-h);right:0;bottom:0;
  width:0;overflow:hidden;transition:width .3s;
  background:var(--surface);border-left:.5px solid var(--sep);z-index:150;
}
.hist-drawer.open{width:min(280px,82vw)}
.hist-inner{padding:16px;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.hist-head{font-size:.9rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.hist-close{
  width:28px;height:28px;border-radius:50%;border:none;
  background:var(--surface2);color:var(--t2);font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.hist-close:hover{background:var(--red);color:#fff}
.h-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--sep);font-size:.78rem}
.h-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.h-delta{font-weight:700;min-width:36px;text-align:right}
.h-time{color:var(--t2);font-size:.68rem;margin-left:auto}
.hist-empty{color:var(--t2);font-size:.8rem;text-align:center;padding:16px 0}
</style>
</head>
<body>

<!-- TAB BAR -->
<nav class="tab-bar">
  <a href="index.html" class="tab-item"><span class="ti">🏠</span><span>首頁</span></a>
  <a href="lucky-draw.html" class="tab-item"><span class="ti">🎡</span><span>抽抽樂</span></a>
  <a href="numbers.html" class="tab-item"><span class="ti">🎱</span><span>抽數字</span></a>
  <a href="score-counter.html" class="tab-item active"><span class="ti">🏆</span><span>計數</span></a>
  <a href="pomodoro.html" class="tab-item"><span class="ti">🌱</span><span>時間</span></a>
  <a href="currency.html" class="tab-item"><span class="ti">💱</span><span>匯率</span></a>
  <a href="todo.html" class="tab-item"><span class="ti">✅</span><span>待辦</span></a>
  <div class="nav-theme">
    <div class="nav-t-dot td-light" onclick="setTheme('light')" title="☀️ 亮色"></div>
    <div class="nav-t-dot td-dark"  onclick="setTheme('dark')"  title="🌙 暗色"></div>
  </div>
</nav>

<div class="content">
  <!-- TOP CONTROLS -->
  <div class="top-ctrl">
    <div class="seg-ctrl">
      <button class="seg-btn active" onclick="switchMode('score')">🏆 計分板</button>
      <button class="seg-btn" onclick="switchMode('counter')">🔢 計數器</button>
    </div>
    <div class="ctrl-right">
      <button class="icon-btn" onclick="toggleHist()" title="紀錄">📋</button>
    </div>
  </div>

  <!-- SCOREBOARD -->
  <div id="scoreView">
    <div class="score-main-area" id="scoreMain"></div>
    <div class="rank-sidebar" id="rankSidebar">
      <div class="rank-sidebar-title">🏅 名次</div>
    </div>
  </div>

  <!-- COUNTER -->
  <div id="counterView">
    <div class="counter-wrap" id="counterWrap"></div>
  </div>
</div>

<!-- FAB (score mode only) -->
<button class="fab" id="fab" onclick="addTeam()">+</button>

<!-- History Drawer Overlay -->
<div class="hist-overlay" id="histOverlay" onclick="toggleHist()"></div>
<!-- History Drawer -->
<div class="hist-drawer" id="histDrawer">
  <div class="hist-inner">
    <div class="hist-head">
      <span>📋 得分記錄</span>
      <button class="hist-close" onclick="toggleHist()">✕</button>
    </div>
    <div id="histList"><div class="hist-empty">尚無記錄</div></div>
    <button onclick="clearHist()" style="padding:6px 14px;border-radius:10px;border:none;background:var(--surface2);color:var(--red);font-family:inherit;font-size:.78rem;cursor:pointer;margin-top:auto">清除紀錄</button>
  </div>
</div>

<script>
/* ===== STATE ===== */
let mode='score';
let teams=[
  {id:1,name:'Team A',score:0,color:'#007AFF'},
  {id:2,name:'Team B',score:0,color:'#FF3B30'}
];
let tidCtr=2;
const COLORS=['#007AFF','#FF3B30','#34C759','#FF9500','#AF52DE','#FF375F','#5AC8FA','#FFCC00','#00BCD4'];
let hist=[];

let counter={name:'計數器',value:0,step:1};
let cLog=[];

/* ===== THEME ===== */
function setTheme(t){
  const isDark = (t === 'dark' || t === 'neon' || t === 'neumorphism');
  document.body.dataset.theme = isDark ? 'dark' : '';
  document.querySelectorAll('.nav-t-dot').forEach(d=>d.classList.remove('active'));
  const dot = document.querySelector(isDark ? '.td-dark' : '.td-light');
  if(dot) dot.classList.add('active');
  localStorage.setItem('app-theme', isDark ? 'dark' : '');
}

/* ===== MODE ===== */
const SC_MODES=['score','counter'];
function switchMode(m,pushHash){
  if(pushHash!==false) location.hash=m;
  mode=m;
  document.querySelectorAll('.seg-btn').forEach((b,i)=>b.classList.toggle('active',SC_MODES[i]===m));
  document.getElementById('scoreView').style.display=m==='score'?'flex':'none';
  document.getElementById('counterView').style.display=m==='counter'?'flex':'none';
  document.getElementById('fab').style.display=m==='score'?'flex':'none';
  if(m==='score')renderScore();
  else renderCounter();
}
window.addEventListener('hashchange',function(){
  const h=location.hash.replace('#','');
  if(SC_MODES.includes(h))switchMode(h,false);
});

/* ===== SCOREBOARD ===== */
function renderRankings(){
  const sb=document.getElementById('rankSidebar');
  if(!sb)return;
  const sorted=[...teams].sort((a,b)=>b.score-a.score);
  const ICONS=['👑','🥈','🥉'];
  let html=`<div class="rank-sidebar-title">🏅 名次</div>`;
  if(!teams.length){html+=`<div style="color:var(--t2);font-size:.7rem;text-align:center;margin-top:8px">尚無隊伍</div>`;}
  sorted.forEach((t,i)=>{
    html+=`<div class="rank-item">
      <span class="rank-pos">${ICONS[i]||'#'+(i+1)}</span>
      <span class="rank-name" style="color:${t.color}">${t.name}</span>
      <span class="rank-pts" style="color:${t.color}">${t.score}</span>
    </div>`;
  });
  sb.innerHTML=html;
}

function renderScore(){
  const sm=document.getElementById('scoreMain');
  const n=teams.length;
  const sorted=[...teams].sort((a,b)=>b.score-a.score);

  if(n<=2){
    // VS layout
    let html=`<div class="vs-wrap">`;
    teams.forEach((t)=>{
      const isLead=n>1&&t.score===Math.max(...teams.map(x=>x.score));
      html+=`<div class="score-side">
        <button class="side-del" onclick="removeTeam(${t.id})">×</button>
        <div class="team-row">
          <div class="t-color-bar" style="background:${t.color}"></div>
          <input class="team-name-inp" value="${t.name}" style="color:${t.color}"
            onchange="teams.find(x=>x.id===${t.id}).name=this.value">
        </div>
        <div class="rank-ico">${isLead?'👑':''}</div>
        <div class="big-score" id="sc${t.id}" style="color:${t.color}">${t.score}</div>
        <div class="sc-btns">
          <button class="sc-btn m" onclick="changeScore(${t.id},-1)">−</button>
          <button class="sc-btn p" onclick="changeScore(${t.id},1)">+</button>
        </div>
      </div>`;
    });
    if(n===2) html+=`<div class="vs-badge">VS</div>`;
    html+=`</div>`;
    html+=`<div class="score-footer">
      <button class="footer-btn danger" onclick="resetAll()">↺ 全部歸零</button>
    </div>`;
    sm.innerHTML=html;
  } else {
    // Grid layout — 明確指定 rows 使所有隊伍填滿容器，不滾動
    const cols=n<=4?2:3;
    const numRows=Math.ceil(n/cols);
    let html=`<div class="grid-wrap" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${numRows},1fr);--rows:${numRows}">`;
    teams.forEach(t=>{
      html+=`<div class="grid-card">
        <button class="grid-del" onclick="removeTeam(${t.id})">×</button>
        <input class="team-name-inp grid-name-inp" value="${t.name}" style="color:${t.color}"
          onchange="teams.find(x=>x.id===${t.id}).name=this.value">
        <div class="grid-score" id="sc${t.id}" style="color:${t.color}">${t.score}</div>
        <div class="grid-btns">
          <button class="g-btn" style="background:var(--red)" onclick="changeScore(${t.id},-1)">−</button>
          <button class="g-btn" style="background:var(--green)" onclick="changeScore(${t.id},1)">+</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
    html+=`<div class="score-footer">
      <button class="footer-btn danger" onclick="resetAll()">↺ 全部歸零</button>
    </div>`;
    sm.innerHTML=html;
    // Attach swipe-spin to each score number
    teams.forEach(t=>{
      const el=document.getElementById(`sc${t.id}`);
      if(!el)return;
      addSwipeSpin(el,d=>{
        const dir=d>0?1:-1;
        for(let i=0;i<Math.abs(d);i++)changeScore(t.id,dir);
      },10);
    });
  }
  renderRankings();
}

function changeScore(id,dir){
  const t=teams.find(x=>x.id===id);if(!t)return;
  const delta=dir;
  t.score+=delta;
  hist.unshift({name:t.name,delta,color:t.color,
    time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
  if(hist.length>60)hist.pop();
  renderHistList();
  // Animate just the number
  const el=document.getElementById(`sc${id}`);
  if(el){el.textContent=t.score;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  // Re-render fully for crown/rank update (also refreshes sidebar)
  renderScore();
}

function addTeam(){
  if(teams.length>=9)return;
  const id=++tidCtr;
  teams.push({id,name:`Team ${String.fromCharCode(64+teams.length+1)}`,score:0,color:COLORS[(teams.length)%COLORS.length]});
  renderScore();
}
function removeTeam(id){if(teams.length<=1)return;teams=teams.filter(t=>t.id!==id);renderScore();}
function resetAll(){teams.forEach(t=>t.score=0);renderScore();}

/* ===== HISTORY ===== */
function toggleHist(){
  document.getElementById('histDrawer').classList.toggle('open');
  document.getElementById('histOverlay').classList.toggle('show');
}
function clearHist(){hist=[];cLog=[];renderHistList();}
function renderHistList(){
  const el=document.getElementById('histList');
  if(!el)return;
  if(!hist.length){el.innerHTML='<div class="hist-empty">尚無記錄</div>';return;}
  el.innerHTML=hist.slice(0,40).map(h=>`
    <div class="h-item">
      <div class="h-dot" style="background:${h.color}"></div>
      <span style="font-weight:600;color:${h.color}">${h.name}</span>
      <span class="h-delta" style="color:${h.delta>=0?'var(--green)':'var(--red)'}">${h.delta>=0?'+':''}${h.delta}</span>
      <span class="h-time">${h.time}</span>
    </div>`).join('');
}

/* ===== COUNTER ===== */
function renderCounter(){
  const w=document.getElementById('counterWrap');
  const hue=(210+counter.value*2)%360;
  const sat=document.body.dataset.theme==='dark'?'65%':'48%';
  const col=`hsl(${hue},85%,${sat})`;
  w.innerHTML=`
    <input class="counter-title-inp" value="${counter.name}"
      onchange="counter.name=this.value">
    <div class="counter-num" id="cnum" style="color:${col}">${counter.value.toLocaleString()}</div>
    <div class="c-step-row">
      <span>計分單位</span>
      <input type="number" class="c-step-inp" id="cstep" value="${counter.step}" min="1" max="9999"
        onchange="counter.step=parseInt(this.value)||1">
    </div>
    <div class="c-btns">
      <button class="c-btn cm" onclick="adjCounter(-1)">−</button>
      <button class="c-btn cp" onclick="adjCounter(1)">+</button>
    </div>
    <button class="c-reset-btn" onclick="resetCounter()">↺ 歸零</button>`;
  // Attach swipe-spin to counter number
  const cnumEl=document.getElementById('cnum');
  if(cnumEl) addSwipeSpin(cnumEl,d=>{
    const dir=d>0?1:-1;
    for(let i=0;i<Math.abs(d);i++)adjCounter(dir);
  },8);
  // Attach swipe-spin to step input
  const stepEl=document.getElementById('cstep');
  if(stepEl) addSwipeSpin(stepEl,d=>{
    const cur=parseInt(stepEl.value)||1;
    stepEl.value=Math.max(1,Math.min(9999,cur+d));
    counter.step=parseInt(stepEl.value)||1;
  },6);
}

function adjCounter(dir){
  counter.step=parseInt(document.getElementById('cstep')?.value)||1;
  counter.value+=dir*counter.step;
  const hue=(210+counter.value*2)%360;
  const sat=document.body.dataset.theme==='dark'?'65%':'48%';
  const col=`hsl(${hue},85%,${sat})`;
  const now=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const entry={delta:dir*counter.step, time:now};
  cLog.unshift(entry);
  if(cLog.length>20)cLog.pop();
  // 同步寫入右側紀錄區
  hist.unshift({name:counter.name, delta:dir*counter.step, color:col, time:now});
  if(hist.length>60)hist.pop();
  renderHistList();
  const el=document.getElementById('cnum');
  if(el){el.textContent=counter.value.toLocaleString();el.style.color=col;
    el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
}
function resetCounter(){counter.value=0;cLog=[];renderCounter();}

/* ===== SWIPE-SPIN ===== */
function addSwipeSpin(el,onDelta,pxPerStep){
  if(!el)return;
  pxPerStep=pxPerStep||10;
  let y0=0,acc=0,on=false,drag=false;
  el.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;acc=0;on=true;drag=false;},{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!on)return;const dy=y0-e.touches[0].clientY;
    if(!drag&&Math.abs(dy)<6)return;drag=true;e.preventDefault();
    const step=Math.round(dy/pxPerStep);const inc=step-acc;if(inc){onDelta(inc);acc=step;}
  },{passive:false});
  el.addEventListener('touchend',()=>{on=false;drag=false;});
  el.addEventListener('mousedown',e=>{y0=e.clientY;acc=0;on=true;drag=false;e.preventDefault();});
  window.addEventListener('mousemove',e=>{
    if(!on)return;const dy=y0-e.clientY;
    if(!drag&&Math.abs(dy)<4)return;drag=true;
    const step=Math.round(dy/pxPerStep);const inc=step-acc;if(inc){onDelta(inc);acc=step;}
  });
  window.addEventListener('mouseup',()=>{on=false;drag=false;});
}

  const saved = localStorage.getItem('app-theme') || '';
  setTheme(saved);
})();

  const h=location.hash.replace('#','');
